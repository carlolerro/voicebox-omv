name: Apply MCP profile management

on:
  push:
    branches:
      - feature/mcp-profile-management
    paths:
      - scripts/apply_mcp_profile_management.py
      - .github/workflows/apply-mcp-profile-management.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mcp-profile-management
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight backend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.24,<2" \
            "fastapi>=0.109" \
            "pydantic>=2.5" \
            "sqlalchemy>=2" \
            "fastmcp>=3,<4" \
            "soundfile>=0.12" \
            "librosa>=0.10" \
            "Pillow>=10" \
            "python-multipart>=0.0.6"

      - name: Apply implementation
        run: python scripts/apply_mcp_profile_management.py

      - name: Keep unit tests independent from heavyweight model packages
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_mcp_profile_tools.py")
          text = path.read_text(encoding="utf-8")
          marker = "from sqlalchemy.pool import StaticPool\n\n"
          stub = '''from sqlalchemy.pool import StaticPool\n\n# The profile service imports cache helpers whose production implementation\n# depends on torch. These tests exercise profile metadata and audio storage,\n# so a tiny cache stub keeps the unit-test dependency set intentionally light.\n_cache_stub = ModuleType("backend.utils.cache")\n_cache_stub._get_cache_dir = lambda: Path(tempfile.gettempdir()) / "voicebox-test-cache"\n_cache_stub.clear_profile_cache = lambda _profile_id: None\nsys.modules["backend.utils.cache"] = _cache_stub\n\n'''
          if marker not in text:
              raise RuntimeError("test import marker not found")
          text = text.replace(marker, stub, 1)
          text = text.replace(
              "    get_profile,\n)\nfrom backend.mcp_server.tools import register_tools\n",
              "    get_profile,\n    register_profile_tools,\n)\n",
              1,
          )
          text = text.replace("        register_tools(fake)\n", "        register_profile_tools(fake)\n", 1)
          text = text.replace(
              '''            {\n                "voicebox.speak",\n                "voicebox.transcribe",\n                "voicebox.list_captures",\n                "voicebox.list_profiles",\n                "voicebox.list_preset_voices",\n                "voicebox.create_profile",\n                "voicebox.get_profile",\n                "voicebox.add_profile_sample",\n            },\n''',
              '''            {\n                "voicebox.list_preset_voices",\n                "voicebox.create_profile",\n                "voicebox.get_profile",\n                "voicebox.add_profile_sample",\n            },\n''',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run MCP profile tests
        run: python -m unittest backend.tests.test_mcp_profile_tools -v

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Verify scope and whitespace
        run: |
          git diff --check
          if git diff --name-only | grep -E \
            'backend/database/migrations|app/src|backend/services/export_import.py|docker-compose.yml|Dockerfile'; then
            echo "Unexpected out-of-scope file change" >&2
            exit 1
          fi

      - name: Commit verified implementation
        run: |
          rm scripts/apply_mcp_profile_management.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: manage Voicebox profiles through MCP"
          git push origin HEAD:feature/mcp-profile-management
